syntax = "proto3";

package s78.trading.v1;

option go_package = "github.com/the-web3/s78-market-services/trading/rpc/pb;tradingv1";

service TradingService {
  rpc SubmitOrder(SubmitOrderRequest) returns (CommandResult);
  rpc CancelOrder(CancelOrderRequest) returns (CommandResult);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse);
  rpc ListAccountTrades(ListAccountTradesRequest) returns (ListAccountTradesResponse);
  rpc ListOrderEvents(ListOrderEventsRequest) returns (ListOrderEventsResponse);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (OrderBook);
  rpc GetStatus(GetStatusRequest) returns (StatusResponse);
  rpc GetRecoveryStatus(GetRecoveryStatusRequest) returns (RecoveryStatusResponse);
  rpc PromoteRecovery(PromoteRecoveryRequest) returns (RecoveryStatusResponse);
  rpc AdminFundVirtual(AdminFundVirtualRequest) returns (CommandResult);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream EventEnvelope);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

message SubmitOrderRequest {
  string market_id = 1;
  string account_id = 2;
  string client_order_id = 3;
  Side side = 4;
  OrderType type = 5;
  TimeInForce time_in_force = 6;
  bool post_only = 7;
  string price = 8;
  string quantity = 9;
  string quote_budget = 10;
}

message CancelOrderRequest {
  string market_id = 1;
  string account_id = 2;
  string request_id = 3;
  string order_id = 4;
}

message GetOrderRequest {
  string market_id = 1;
  string account_id = 2;
  string order_id = 3;
}

message ListOrdersRequest {
  string market_id = 1;
  string account_id = 2;
  optional bool open_only = 3;
  uint32 limit = 4;
  string cursor = 5;
  string scope = 6;
  string status = 7;
  string side = 8;
  string type = 9;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_cursor = 2;
}

message ListTradesRequest {
  string market_id = 1;
  string account_id = 2 [deprecated = true];
  uint32 limit = 3;
}

message ListTradesResponse {
  repeated Trade trades = 1;
}

message GetBalancesRequest {
  string market_id = 1;
  string account_id = 2;
}

message GetBalancesResponse {
  repeated Balance balances = 1;
}

message GetOrderBookRequest {
  string market_id = 1;
  uint32 levels = 2;
}

message GetStatusRequest {
  string market_id = 1;
}

message GetRecoveryStatusRequest {
  string market_id = 1;
}

message RecoveryBinding {
  string market_id = 1;
  string epoch_id = 2;
  string version = 3;
  string runtime_sequence = 4;
  string state_hash = 5;
  RecoveryProvenance provenance = 6;
}

message RecoveryProvenance {
  string production_origin = 1;
  string deployment_id = 2;
  string release_commit = 3;
  string source_digest = 4;
  string deployment_url = 5;
}

message RecoveryTransportEvidence {
  uint32 sample_count = 1;
  string first_sample_at = 2;
  string last_sample_at = 3;
  string maximum_gap_ms = 4;
  string evidence_sha256 = 5;
  RecoveryProvenance provenance = 6;
}

message PromoteRecoveryRequest {
  RecoveryBinding binding = 1;
  RecoveryTransportEvidence transport_evidence = 2;
}

message RecoveryStatusResponse {
  string market_id = 1;
  string epoch_id = 2;
  string phase = 3;
  string version = 4;
  string runtime_sequence = 5;
  string state_hash = 6;
  bool writes_enabled = 7;
  bool continuity_uncertain = 8;
  string continuity_error = 9;
  string updated_at = 10;
  RecoveryProvenance provenance = 11;
}

message AdminFundVirtualRequest {
  string market_id = 1;
  string request_id = 2;
  string account_id = 3;
  string asset = 4;
  string amount = 5;
}

message SubscribeEventsRequest {
  string market_id = 1;
  string cursor_sequence = 2;
  uint32 cursor_event_index = 3;
}

message CommandResult {
  string sequence = 1;
  string order_id = 2;
  string status = 3;
  repeated Event events = 4;
}

message Order {
  string id = 1;
  string client_order_id = 2;
  string account_id = 3;
  string market_id = 4;
  string side = 5;
  string type = 6;
  string time_in_force = 7;
  bool post_only = 8;
  string price = 9;
  string original_quantity = 10;
  string remaining_quantity = 11;
  string filled_quantity = 12;
  string original_quote_budget = 13;
  string remaining_quote_budget = 14;
  string spent_quote = 15;
  string held_asset = 16;
  string held_amount = 17;
  string status = 18;
  string accepted_sequence = 19;
  string last_sequence = 20;
  string reject_reason = 21;
  string average_fill_price = 22;
  string created_at = 23;
  string updated_at = 24;
}

message Fee {
  string account_id = 1;
  string asset = 2;
  string amount = 3;
  string rate_bps = 4;
  string role = 5;
}

message Trade {
  string id = 1;
  string market_id = 2;
  string price = 3;
  string quantity = 4;
  string quote_amount = 5;
  string maker_order_id = 6;
  string taker_order_id = 7;
  string maker_account_id = 8;
  string taker_account_id = 9;
  string buyer_account_id = 10;
  string seller_account_id = 11;
  Fee buyer_fee = 12;
  Fee seller_fee = 13;
}

message Event {
  string sequence = 1;
  uint32 index = 2;
  string type = 3;
  string account_id = 4;
  string order_id = 5;
  string client_order_id = 6;
  string status = 7;
  string side = 8;
  string price = 9;
  string quantity = 10;
  string remaining = 11;
  string quote_amount = 12;
  string asset = 13;
  string amount = 14;
  string reason = 15;
  Trade trade = 16;
  string remaining_quote_budget = 17;
}

message Balance {
  string asset = 1;
  string available = 2;
  string held = 3;
}

message PriceLevel {
  string price = 1;
  string quantity = 2;
  uint32 order_count = 3;
}

message OrderBook {
  string market_id = 1;
  string sequence = 2;
  repeated PriceLevel bids = 3;
  repeated PriceLevel asks = 4;
}

message StatusResponse {
  string market_id = 1;
  string state = 2;
  string sequence = 3;
  uint32 queue_depth = 4;
  string recovery_count = 5;
  string last_error = 6;
  string last_incident = 7;
  string last_incident_at = 8;
  string last_recovered_at = 9;
  string outbox_state = 10;
  string outbox_checkpoint_sequence = 11;
  uint32 outbox_checkpoint_event_index = 12;
  string outbox_last_error = 13;
  string outbox_last_published_at = 14;
  string outbox_last_cleanup_at = 15;
  string state_hash = 16;
}

message EventEnvelope {
  string market_id = 1;
  string sequence = 2;
  uint32 event_index = 3;
  Event event = 4;
}

message ListAccountTradesRequest {
  string market_id = 1;
  string account_id = 2;
  string cursor = 3;
  uint32 limit = 4;
  string side = 5;
}

message ListAccountTradesResponse {
  repeated AccountTrade trades = 1;
  string next_cursor = 2;
}

message ListOrderEventsRequest {
  string market_id = 1;
  string account_id = 2;
  string order_id = 3;
  string cursor = 4;
  uint32 limit = 5;
}

message ListOrderEventsResponse {
  repeated OrderEvent events = 1;
  string next_cursor = 2;
}

message ListLedgerEntriesRequest {
  string market_id = 1;
  string account_id = 2;
  string cursor = 3;
  uint32 limit = 4;
  string asset = 5;
  string reason = 6;
}

message ListLedgerEntriesResponse {
  repeated AccountLedgerEntry entries = 1;
  string next_cursor = 2;
}

// AccountTrade contains facts for exactly one authenticated account and never
// carries counterparty account or order identity.
message AccountTrade {
  string id = 1;
  string market_id = 2;
  string order_id = 3;
  string side = 4;
  string liquidity_role = 5;
  string price = 6;
  string quantity = 7;
  string quote_amount = 8;
  string fee_asset = 9;
  string fee_amount = 10;
  string fee_rate_bps = 11;
  string sequence = 12;
  uint32 event_index = 13;
  string occurred_at = 14;
}

message AccountFee {
  string asset = 1;
  string amount = 2;
  string rate_bps = 3;
  string role = 4;
}

message BalanceEffect {
  string asset = 1;
  string bucket = 2;
  string amount = 3;
  string reason = 4;
  string transaction_id = 5;
}

message OrderEvent {
  string event_id = 1;
  string market_id = 2;
  string order_id = 3;
  string sequence = 4;
  uint32 event_index = 5;
  uint32 timeline_index = 6;
  string source_kind = 7;
  string type = 8;
  string status = 9;
  string quantity = 10;
  string price = 11;
  string remaining_quantity = 12;
  string remaining_quote_budget = 13;
  string trade_id = 14;
  AccountFee fee = 15;
  repeated BalanceEffect balance_effects = 16;
  string reason = 17;
  string occurred_at = 18;
}

message AccountLedgerEntry {
  string entry_id = 1;
  string market_id = 2;
  string sequence = 3;
  string transaction_id = 4;
  uint32 entry_index = 5;
  string asset = 6;
  string bucket = 7;
  string amount = 8;
  string reason = 9;
  string reference = 10;
  string order_id = 11;
  string trade_id = 12;
  string occurred_at = 13;
}
